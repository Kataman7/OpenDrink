<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0f1a" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <title>OpenDrink</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <!-- SCREEN: LOADING -->
      <section id="screen-loading" class="screen">
        <div class="screen-inner loading-screen">
          <div class="loading-spinner"></div>
          <p id="loading-text" data-i18n="loading.message">Loading...</p>
        </div>
      </section>

      <!-- SCREEN: LOBBY -->
      <section id="screen-lobby" class="screen">
        <div class="screen-inner">
          <h1 class="title" data-i18n="app.title">OpenDrink</h1>
          <p class="subtitle" data-i18n="lobby.subtitle">Add players to start</p>

          <div class="field-group">
            <label class="field-label" for="lang-select" data-i18n="lobby.language">Language</label>
            <select id="lang-select" class="input-field select-field"></select>
          </div>

          <div class="input-row">
            <input
              type="text"
              id="player-name-input"
              class="input-field"
              placeholder="Player name"
              data-i18n-placeholder="lobby.playerPlaceholder"
              maxlength="20"
              autocomplete="off"
            />
            <button id="btn-add-player" class="btn btn-primary" data-action="add-player">+</button>
          </div>

          <p id="player-count" class="player-count">0 players</p>
          <ul id="player-list" class="player-list"></ul>

          <button
            id="btn-start-game"
            class="btn btn-large btn-accent"
            data-action="start-game"
            data-i18n="lobby.startGame"
          >
            Start game
          </button>
        </div>
      </section>

      <!-- SCREEN: MODE -->
      <section id="screen-mode" class="screen hidden">
        <div class="screen-inner">
          <h2 class="title" data-i18n="mode.title">Choose mode</h2>
          <div class="mode-buttons">
            <button
              class="btn btn-large btn-mode"
              data-action="select-mode"
              data-mode="never_have_i_ever"
            >
              <span class="btn-mode-icon">🍻</span>
              <span data-i18n="mode.neverHaveIEver">Never Have I Ever</span>
            </button>
            <button
              class="btn btn-large btn-mode"
              data-action="select-mode"
              data-mode="action_truth"
            >
              <span class="btn-mode-icon">🎭</span>
              <span data-i18n="mode.truthOrDare">Truth or Dare</span>
            </button>
            <button
              class="btn btn-large btn-mode"
              data-action="select-mode"
              data-mode="would_you_rather"
            >
              <span class="btn-mode-icon">⚡</span>
              <span data-i18n="mode.wouldYouRather">Would You Rather</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="who_could">
              <span class="btn-mode-icon">🕵️</span>
              <span data-i18n="mode.whoCould">Who Could</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="impostor">
              <span class="btn-mode-icon">🤫</span>
              <span data-i18n="mode.impostor">Impostor</span>
            </button>
            <button
              class="btn btn-large btn-mode"
              data-action="select-mode"
              data-mode="seven_seconds"
            >
              <span class="btn-mode-icon">⏱️</span>
              <span data-i18n="mode.sevenSeconds">7 Seconds</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="its_a_10">
              <span class="btn-mode-icon">💯</span>
              <span data-i18n="mode.itsA10">It's a 10</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="quiz">
              <span class="btn-mode-icon">🧠</span>
              <span data-i18n="mode.quiz">Quiz</span>
            </button>
            <button
              class="btn btn-large btn-mode"
              data-action="select-mode"
              data-mode="team_battle"
            >
              <span class="btn-mode-icon">⚔️</span>
              <span data-i18n="mode.teamBattle">Team Battle</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="dormelles">
              <span class="btn-mode-icon">🃏</span>
              <span data-i18n="mode.dormelles">Dormelles</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="picolo">
              <span class="btn-mode-icon">🍻</span>
              <span data-i18n="mode.picolo">Picolo</span>
            </button>
            <button class="btn btn-large btn-mode" data-action="select-mode" data-mode="truth_dare">
              <span class="btn-mode-icon">🎴</span>
              <span data-i18n="mode.truthDare">Truth or Dare</span>
            </button>
            <button class="btn btn-large btn-accent" data-action="select-mode" data-mode="random">
              <span class="btn-mode-icon">🎲</span>
              <span data-i18n="mode.random">Random</span>
            </button>
          </div>
          <button
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="common.back"
          >
            Back
          </button>
        </div>
      </section>

      <!-- SCREEN: MODE RANDOM -->
      <section id="screen-mode_random" class="screen hidden">
        <div class="screen-inner">
          <h2 class="title" data-i18n="modeRandom.title">Select modes</h2>
          <p class="subtitle" data-i18n="modeRandom.subtitle">Pick the modes you want to mix</p>
          <div id="mode-random-list" class="mode-random-list"></div>
          <button
            id="btn-random-confirm"
            class="btn btn-large btn-accent"
            data-action="random-confirm"
            data-i18n="modeRandom.confirm"
          >
            Next
          </button>
          <button
            id="btn-back-mode-random"
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="common.back"
          >
            Back
          </button>
        </div>
      </section>

      <!-- SCREEN: IMPOSTOR REVEAL -->
      <section id="screen-impostor_reveal" class="screen hidden">
        <div class="screen-inner game-screen-inner">
          <div class="game-card">
            <p id="impostor-step-title" class="game-player"></p>
            <p id="impostor-step-hint" class="game-type"></p>
            <p id="impostor-word" class="game-text hidden"></p>
            <div id="impostor-accusation" class="hidden">
              <div id="impostor-candidates" class="mode-buttons"></div>
              <p id="impostor-result" class="subtitle"></p>
            </div>
          </div>
          <button
            id="btn-impostor-reveal"
            class="btn btn-large btn-primary"
            data-action="impostor-reveal"
            data-i18n="impostor.revealWord"
          >
            Reveal word
          </button>
          <button
            id="btn-impostor-next"
            class="btn btn-large btn-accent hidden"
            data-action="impostor-next"
            data-i18n="impostor.nextPlayer"
          >
            Next player
          </button>
          <button
            id="btn-impostor-finish"
            class="btn btn-large btn-accent hidden"
            data-action="impostor-finish"
            data-i18n="impostor.startAccusation"
          >
            Start accusation
          </button>
          <button
            id="btn-back-impostor"
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="game.backToLobby"
          >
            Back to lobby
          </button>
        </div>
      </section>

      <!-- SCREEN: IMPOSTOR SETTINGS -->
      <section id="screen-impostor_settings" class="screen hidden">
        <div class="screen-inner" style="max-width: 320px">
          <div class="role-list">
            <div class="role-card">
              <span class="role-label" data-i18n="impostorSettings.impostors">Impostors</span>
              <div class="role-row">
                <button class="btn btn-large btn-round" data-action="impostor-dec-impostors">
                  −
                </button>
                <span id="impostor-count" class="role-value">1</span>
                <button class="btn btn-large btn-round" data-action="impostor-inc-impostors">
                  +
                </button>
              </div>
            </div>
            <div class="role-card">
              <span class="role-label">Mr. White</span>
              <div class="role-row">
                <button class="btn btn-large btn-round" data-action="impostor-dec-white">−</button>
                <span id="mr-white-count" class="role-value">0</span>
                <button class="btn btn-large btn-round" data-action="impostor-inc-white">+</button>
              </div>
            </div>
            <div class="role-card">
              <span class="role-label" data-i18n="impostorSettings.citizens">Citizens</span>
              <span id="citizen-count" class="role-value role-value--auto">5</span>
            </div>
          </div>
          <button class="btn btn-large btn-accent" data-action="impostor-start">
            <span class="btn-mode-icon">🕵️</span>
            <span data-i18n="impostorSettings.start">Start Impostor</span>
          </button>
          <button
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="common.back"
          >
            Back
          </button>
        </div>
      </section>

      <!-- SCREEN: INTENSITY -->
      <section id="screen-intensity" class="screen hidden">
        <div class="screen-inner">
          <h2 class="title" data-i18n="intensity.title">Intensity</h2>
          <div class="mode-buttons">
            <button
              class="btn btn-large btn-intensity"
              data-action="select-intensity"
              data-intensity="soft"
            >
              <span class="btn-mode-icon">😊</span>
              <span data-i18n="intensity.soft">Soft</span>
            </button>
            <button
              class="btn btn-large btn-intensity"
              data-action="select-intensity"
              data-intensity="hot"
            >
              <span class="btn-mode-icon">🔥</span>
              <span data-i18n="intensity.hot">Hot</span>
            </button>
            <button
              class="btn btn-large btn-intensity"
              data-action="select-intensity"
              data-intensity="mixed"
            >
              <span class="btn-mode-icon">🎲</span>
              <span data-i18n="intensity.mixed">Mixed</span>
            </button>
          </div>
          <button
            id="btn-back-intensity"
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="common.back"
          >
            Back
          </button>
        </div>
      </section>

      <!-- SCREEN: GAME -->
      <section id="screen-game" class="screen hidden">
        <div class="screen-inner game-screen-inner">
          <div class="game-card">
            <p id="player-name" class="game-player"></p>
            <p id="question-type" class="game-type"></p>
            <p id="question-text" class="game-text"></p>
            <p id="seven-timer" class="seven-timer hidden"></p>
            <div id="wyr-choices" class="wyr-choices hidden">
              <p id="wyr-choice-a" class="wyr-choice"></p>
              <p id="wyr-separator" class="wyr-separator" data-i18n="game.or">OR</p>
              <p id="wyr-choice-b" class="wyr-choice"></p>
            </div>
            <div id="quiz-options" class="mode-buttons hidden"></div>
          </div>
          <button
            id="btn-next"
            class="btn btn-large btn-primary"
            data-action="next-round"
            data-i18n="game.next"
          >
            Next
          </button>
          <button
            id="btn-auto-read"
            class="btn btn-large btn-secondary"
            data-action="toggle-auto-read"
          >
            Lecture OFF
          </button>
          <button
            id="btn-back-game"
            class="btn btn-large btn-secondary"
            data-action="back-lobby"
            data-i18n="game.backToLobby"
          >
            Back to lobby
          </button>
        </div>
      </section>

      <!-- ERROR TOAST -->
      <div id="error-toast" class="error-toast hidden"></div>

      <footer class="site-footer">
        <a href="https://github.com/Kataman7/OpenDrink" target="_blank" rel="noreferrer">
          github.com/Kataman7/OpenDrink
        </a>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
